name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  fresh-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Simulates exactly what `laravel new my-app --using=recodex-id/rewire` triggers under the
      # hood (`composer create-project`), against this checkout rather than whatever's currently
      # published on Packagist -- so a regression here is caught before it's ever published.
      # The destination must live outside $GITHUB_WORKSPACE: it's also the path-repository
      # source, and Composer refuses to install a path package into its own source directory.
      - name: Simulate a fresh `composer create-project` install
        run: |
          composer create-project \
            --repository='{"type":"path","url":"'"$GITHUB_WORKSPACE"'","options":{"symlink":false}}' \
            recodex-id/rewire "$RUNNER_TEMP/fresh-install" --stability=dev --no-interaction

      - name: Build frontend assets
        working-directory: ${{ runner.temp }}/fresh-install
        run: |
          npm install
          npm run build

      - name: Verify the installed app actually boots and serves seeded data
        working-directory: ${{ runner.temp }}/fresh-install
        run: |
          php artisan migrate:status
          php artisan serve --no-interaction &
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:8000 -o /tmp/homepage.html; then
              break
            fi
            sleep 1
          done
          grep -q "Rewire Starter Kit" /tmp/homepage.html
